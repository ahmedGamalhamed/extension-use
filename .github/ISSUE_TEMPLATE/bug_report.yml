name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest setup that shows the problem. A repo or a snippet of your defineHost() and the call helps most.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "@extension-use/host 0.1.0, Chrome 142, WXT 0.20"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      multiple: true
      options: [frame, page, remote (relay), MCP, not sure]
