name: Release

# Changesets opens a "Version packages" PR when changesets land on main.
# Merging that PR publishes the new versions to npm through trusted publishing
# (OIDC): no npm token is stored anywhere, and npm adds provenance.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push release tags
  pull-requests: write # open the Version packages PR
  id-token: write # npm trusted publishing

jobs:
  release:
    if: github.repository == 'ahmedGamalhamed/extension-use'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only opens or updates the Version packages PR. It doesn't publish:
      # changesets/action v1 publishes with a token, not OIDC.
      - id: changesets
        uses: changesets/action@v1
        with:
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No changesets left means the Version packages PR was just merged.
      # changeset publish skips versions that are already on npm.
      - name: Publish to npm (trusted publishing)
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          # Trusted publishing needs npm 11.5.1+. npm 12 rejects the --git-checks
          # flag that pnpm 10 passes to it, so stay on 11.
          npm install -g npm@11
          npm --version
          pnpm release
          git push origin --tags
