name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the action reference is up to date
        run: pnpm docs:actions && git diff --exit-code docs/actions.md
      - name: Build the docs site (fails on dead links)
        run: pnpm docs:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
